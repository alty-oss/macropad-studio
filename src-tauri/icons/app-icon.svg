<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Logo do Macropad Studio: três teclas e um knob num quadrado arredondado azul-violeta. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3f7cff"/><stop offset=".55" stop-color="#4f5bff"/><stop offset="1" stop-color="#8a3dff"/></linearGradient>
    <radialGradient id="shine" cx=".25" cy=".12" r=".95"><stop offset="0" stop-color="#ffffff" stop-opacity=".32"/><stop offset=".6" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe5ff"/></linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1a0b5c" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#shine)"/>
  <g filter="url(#drop)">
    <rect x="182" y="182" width="296" height="296" rx="76" fill="url(#key)"/>
    <rect x="546" y="182" width="296" height="296" rx="76" fill="#ffffff" fill-opacity=".5"/>
    <rect x="182" y="546" width="296" height="296" rx="76" fill="#ffffff" fill-opacity=".5"/>
    <circle cx="694" cy="694" r="148" fill="url(#key)"/>
  </g>
  <circle cx="694" cy="694" r="104" fill="none" stroke="#4f5bff" stroke-opacity=".22" stroke-width="10"/>
  <path d="M729 659 777 611" stroke="#4f5bff" stroke-width="34" stroke-linecap="round"/>
</svg>
